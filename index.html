<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>WebXR AR - Dog or Cat Model</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
    #ui {
      position: absolute;
      top: 20px;
      left: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 10;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <div id="ui">
    <button id="enter-ar">Enter AR</button>
    <button id="place-dog" style="display:none;">Place Dog</button>
    <button id="place-cat" style="display:none;">Place Cat</button>
  </div>

  <script type="module">
  import * as THREE from './node_modules/three/build/three.module.js';
  import { GLTFLoader } from './node_modules/three-gltf-loader/index.js';

  let scene, camera, renderer, reticle;
  let hitTestSource = null;
  let referenceSpace = null;

  const enterBtn = document.getElementById('enter-ar');

  initScene();

  // Start AR session
  enterBtn.addEventListener('click', async () => {
    try {
      const session = await navigator.xr.requestSession('immersive-ar', {
        requiredFeatures: ['hit-test', 'local-floor'],
        optionalFeatures: ['dom-overlay'],
        domOverlay: { root: document.body }
      });

      renderer.xr.enabled = true;
      renderer.xr.setSession(session);

      referenceSpace = await session.requestReferenceSpace('local-floor');
      const viewerSpace = await session.requestReferenceSpace('viewer');
      hitTestSource = await session.requestHitTestSource({ space: viewerSpace });

      session.addEventListener('end', () => {
        hitTestSource = null;
      });

      // Load and place models
      placeModels();

      renderer.setAnimationLoop((timestamp, frame) => {
        if (frame) {
          const hitTestResults = frame.getHitTestResults(hitTestSource);
          if (hitTestResults.length > 0) {
            const hit = hitTestResults[0].getPose(referenceSpace);
            reticle.visible = true;
            reticle.matrix.fromArray(hit.transform.matrix);
          } else {
            reticle.visible = false;
          }
        }

        renderer.render(scene, camera);
      });
    } catch (error) {
      alert('Error starting AR session: ' + error.message);
    }
  });

  function initScene() {
    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera();

    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.body.appendChild(renderer.domElement);

    const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1);
    scene.add(light);

    // Reticle (optional visual feedback)
    const ringGeo = new THREE.RingGeometry(0.08, 0.1, 32).rotateX(-Math.PI / 2);
    const ringMat = new THREE.MeshBasicMaterial({ color: 0x00ff00 });
    reticle = new THREE.Mesh(ringGeo, ringMat);
    reticle.matrixAutoUpdate = false;
    reticle.visible = false;
    scene.add(reticle);
  }

  function placeModels() {
    const loader = new GLTFLoader();

    // Load Dog
    loader.load('dog.glb', (gltf) => {
      const dog = gltf.scene;
      dog.position.set(0, 0, -0.5); // 0.5 meters in front
      dog.scale.set(0.2, 0.2, 0.2);
      scene.add(dog);
    }, undefined, (error) => {
      alert('Error loading dog model: ' + error.message);
    });

    // Load Cat
    loader.load('cat.glb', (gltf) => {
      const cat = gltf.scene;
      cat.position.set(0.5, 0, -0.5); // slightly to the right
      cat.scale.set(0.2, 0.2, 0.2);
      scene.add(cat);
    }, undefined, (error) => {
      alert('Error loading cat model: ' + error.message);
    });
  }
</script>

</body>
</html>
