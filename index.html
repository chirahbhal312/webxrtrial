<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>WebXR AR - Dog or Cat Model</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
    #ui {
      position: absolute;
      top: 20px;
      left: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 10;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    button:disabled {
      background-color: #cccccc;
      cursor: not-allowed;
    }
    #status {
      background-color: rgba(0, 0, 0, 0.7);
      color: white;
      padding: 10px;
      border-radius: 5px;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div id="ui">
    <button id="place-dog" style="display:none;">Place Dog</button>
    <button id="place-cat" style="display:none;">Place Cat</button>
    <div id="status" style="display:none;"></div>
  </div>

  <script type="module">
    // Import Three.js from CDN to avoid path issues
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.176.0/build/three.module.js';
    import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.176.0/examples/jsm/loaders/GLTFLoader.js';

    let scene, camera, renderer, controller, reticle;
    let hitTestSource = null;
    let referenceSpace = null;
    let modelPlaced = false;
    let currentShape = null;

    const dogBtn = document.getElementById('place-dog');
    const catBtn = document.getElementById('place-cat');
    const statusEl = document.getElementById('status');

    // Initialize scene and check WebXR support
    initScene();
    checkXRSupport();

    // Check if WebXR is supported and start AR session automatically
    async function checkXRSupport() {
      if (!navigator.xr) {
        showAlert("WebXR is not supported on this browser.");
        return;
      }

      try {
        const isSupported = await navigator.xr.isSessionSupported('immersive-ar');
        if (!isSupported) {
          showAlert("WebXR AR is not supported on this device/browser.");
          return;
        }
        
        // Automatically start AR session
        startARSession();
      } catch (error) {
        showAlert("Error checking AR support: " + error.message);
      }
    }

    // Start AR session
    async function startARSession() {
      try {
        showAlert("Starting AR session...");
        
        const session = await navigator.xr.requestSession('immersive-ar', {
          requiredFeatures: ['hit-test', 'local-floor'],
          optionalFeatures: ['dom-overlay'],
          domOverlay: { root: document.body }
        });

        showAlert("AR session started successfully!");
        
        renderer.xr.enabled = true;
        renderer.xr.setSession(session);

        referenceSpace = await session.requestReferenceSpace('local-floor');
        const viewerSpace = await session.requestReferenceSpace('viewer');
        hitTestSource = await session.requestHitTestSource({ space: viewerSpace });

        controller = renderer.xr.getController(0);
        controller.addEventListener('select', onSelect);
        scene.add(controller);

        session.addEventListener('end', () => {
          showAlert("AR session ended");
          hitTestSource = null;
          modelPlaced = false;
          currentShape = null;
          dogBtn.style.display = 'none';
          catBtn.style.display = 'none';
        });

        // Show buttons once AR session starts
        dogBtn.style.display = 'block';
        catBtn.style.display = 'block';

        renderer.setAnimationLoop((timestamp, frame) => {
          if (frame) {
            const hitTestResults = frame.getHitTestResults(hitTestSource);
            if (hitTestResults.length > 0) {
              const hit = hitTestResults[0].getPose(referenceSpace);
              reticle.visible = true;
              reticle.matrix.fromArray(hit.transform.matrix);
            } else {
              reticle.visible = false;
            }
          }

          renderer.render(scene, camera);
        });
      } catch (error) {
        showAlert("Error starting AR session: " + error.message);
      }
    }

    // Set current shape to dog model
    dogBtn.addEventListener('click', () => {
      currentShape = 'dog';
      modelPlaced = false;
      showStatus("Dog model selected. Tap on a surface to place.");
      showAlert("Dog model selected. Tap on a surface to place.");
    });

    // Set current shape to cat model
    catBtn.addEventListener('click', () => {
      currentShape = 'cat';
      modelPlaced = false;
      showStatus("Cat model selected. Tap on a surface to place.");
      showAlert("Cat model selected. Tap on a surface to place.");
    });

    function initScene() {
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera();

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      document.body.appendChild(renderer.domElement);

      // Add lights
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
      scene.add(ambientLight);
      
      const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
      directionalLight.position.set(0, 10, 0);
      scene.add(directionalLight);

      // Reticle
      const ringGeo = new THREE.RingGeometry(0.08, 0.1, 32).rotateX(-Math.PI / 2);
      const ringMat = new THREE.MeshBasicMaterial({ color: 0x00ff00 });
      reticle = new THREE.Mesh(ringGeo, ringMat);
      reticle.matrixAutoUpdate = false;
      reticle.visible = false;
      scene.add(reticle);

      // Handle window resize
      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    }

    function onSelect() {
      if (!reticle.visible || modelPlaced || !currentShape) return;

      const loader = new GLTFLoader();
      let modelUrl = '';

      if (currentShape === 'dog') {
        modelUrl = './dog.glb';  // Replace with the path to dog.glb
      } else if (currentShape === 'cat') {
        modelUrl = './cat.glb';  // Replace with the path to cat.glb
      }

      showStatus(`Loading ${currentShape} model...`);
      showAlert(`Loading ${currentShape} model...`);

      try {
        loader.load(modelUrl, 
          (gltf) => {
            const model = gltf.scene;
            model.position.setFromMatrixPosition(reticle.matrix);
            model.quaternion.setFromRotationMatrix(reticle.matrix);
            model.scale.set(0.2, 0.2, 0.2); // scale down if needed
            scene.add(model);
            modelPlaced = true;
            const successMsg = `${currentShape.charAt(0).toUpperCase() + currentShape.slice(1)} model placed successfully!`;
            showStatus(successMsg);
            showAlert(successMsg);
          }, 
          (progress) => {
            if (progress.total > 0) {
              const percentComplete = Math.round((progress.loaded / progress.total) * 100);
              showStatus(`Loading ${currentShape} model: ${percentComplete}%`);
            }
          },
          (error) => {
            const errorMsg = `Error loading ${currentShape} model: ${error.message}`;
            showStatus(errorMsg);
            showAlert(errorMsg);
          }
        );
      } catch (error) {
        const errorMsg = `Error processing ${currentShape} model: ${error.message}`;
        showStatus(errorMsg);
        showAlert(errorMsg);
      }
    }

    function showStatus(message) {
      statusEl.textContent = message;
      statusEl.style.display = 'block';
    }

    function showAlert(message) {
      // Use alert for critical messages during testing
      alert(message);
    }
  </script>
</body>
</html>
