<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>WebXR AR - Dog or Cat</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
    #ui {
      position: absolute;
      top: 20px;
      left: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 10;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <div id="ui">
    <button id="enter-ar">Enter AR</button>
    <button id="place-dog" style="display:none;">Place Dog</button>
    <button id="place-cat" style="display:none;">Place Cat</button>
  </div>

  <script type="module">
    import * as THREE from 'https://cdn.skypack.dev/three@0.152.2';
    import { GLTFLoader } from 'https://cdn.skypack.dev/three@0.152.2/examples/jsm/loaders/GLTFLoader.js';

    let scene, camera, renderer, controller, reticle;
    let hitTestSource = null;
    let referenceSpace = null;
    let modelPlaced = false;
    let currentShape = null;

    const enterBtn = document.getElementById('enter-ar');
    const dogBtn = document.getElementById('place-dog');
    const catBtn = document.getElementById('place-cat');
    const ui = document.getElementById('ui');

    initScene();

    enterBtn.addEventListener('click', async () => {
      const session = await navigator.xr.requestSession('immersive-ar', {
        requiredFeatures: ['hit-test', 'local-floor'],
        optionalFeatures: ['dom-overlay'],
        domOverlay: { root: document.body }
      });

      renderer.xr.enabled = true;
      renderer.xr.setSession(session);

      referenceSpace = await session.requestReferenceSpace('local-floor');
      const viewerSpace = await session.requestReferenceSpace('viewer');
      hitTestSource = await session.requestHitTestSource({ space: viewerSpace });

      controller = renderer.xr.getController(0);
      controller.addEventListener('select', onSelect);
      scene.add(controller);

      session.addEventListener('end', () => {
        hitTestSource = null;
        modelPlaced = false;
        currentShape = null;
        dogBtn.style.display = 'none';
        catBtn.style.display = 'none';
      });

      // Show buttons once AR session starts
      dogBtn.style.display = 'block';
      catBtn.style.display = 'block';

      renderer.setAnimationLoop((timestamp, frame) => {
        if (frame) {
          const hitTestResults = frame.getHitTestResults(hitTestSource);
          if (hitTestResults.length > 0) {
            const hit = hitTestResults[0].getPose(referenceSpace);
            reticle.visible = true;
            reticle.matrix.fromArray(hit.transform.matrix);
          } else {
            reticle.visible = false;
          }
        }

        renderer.render(scene, camera);
      });
    });

    dogBtn.addEventListener('click', () => {
      currentShape = 'dog';
      modelPlaced = false;
    });

    catBtn.addEventListener('click', () => {
      currentShape = 'cat';
      modelPlaced = false;
    });

    function initScene() {
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera();

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      document.body.appendChild(renderer.domElement);

      const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1);
      scene.add(light);

      // Reticle
      const ringGeo = new THREE.RingGeometry(0.08, 0.1, 32).rotateX(-Math.PI / 2);
      const ringMat = new THREE.MeshBasicMaterial({ color: 0x00ff00 });
      reticle = new THREE.Mesh(ringGeo, ringMat);
      reticle.matrixAutoUpdate = false;
      reticle.visible = false;
      scene.add(reticle);
    }

    function onSelect() {
      if (!reticle.visible || modelPlaced || !currentShape) return;

      const loader = new GLTFLoader();
      let modelUrl = '';
      
      if (currentShape === 'dog') {
        modelUrl = 'dog.glb';  // Replace with path to dog.glb
      } else if (currentShape === 'cat') {
        modelUrl = 'cat.glb';  // Replace with path to cat.glb
      }

      loader.load(modelUrl, (gltf) => {
  const model = gltf.scene;
  model.position.setFromMatrixPosition(reticle.matrix);
  model.quaternion.setFromRotationMatrix(reticle.matrix);
  model.scale.set(0.2, 0.2, 0.2); // scale down if needed
  scene.add(model);
  modelPlaced = true;
}, undefined, (error) => {
  alert('Error loading model: ' + error.message);
});

    }
  </script>
</body>
</html>
